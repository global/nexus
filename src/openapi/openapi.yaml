openapi: 3.0.3
info:
  title: Nexus Insight API
  description: >-
    Application Portfolio Management (APM) backend for Nexus Insight,
    modeled after the Nexus Insight APM Ontology (see ontology/apm-ontology.ttl).
  version: 1.0.0
  license:
    name: MIT
servers:
  - url: /api
    description: >-
      Base path for every documented endpoint. Any request under /api that
      does not match a path/method declared below is rejected by the runtime
      OpenAPI validator; endpoints outside /api are not affected.
tags:
  - name: Auth
    description: Identity of the caller, as issued by the IdP identity provider.
  - name: Applications
    description: >-
      apm:Application (ontology/apm-ontology.ttl) — the ontology-aligned
      application portfolio. Every endpoint requires a bearer token; reads
      require the admin, portfolio-manager, or viewer realm role, writes
      require admin or portfolio-manager, and delete requires admin.
  - name: Actors
    description: >-
      apm:Actor (ontology/apm-ontology.ttl) — a person, organisation, or
      system that participates in business activities, such as an
      application owner. Same role requirements as Applications.
  - name: OrganizationUnits
    description: >-
      apm:OrganizationUnit (ontology/apm-ontology.ttl) — a self-contained
      unit of the enterprise with defined management responsibility. Same
      role requirements as Applications.
  - name: BusinessCapabilities
    description: >-
      apm:BusinessCapability (ontology/apm-ontology.ttl) — an ability the
      business has to deliver value, organised into an L1/L2/L3 hierarchy
      via parentCapability. Same role requirements as Applications.
  - name: Suppliers
    description: >-
      apm:Supplier (ontology/apm-ontology.ttl) — a third-party vendor that
      publishes a software product or hosts an application on the
      organization's behalf. Same role requirements as Applications.
  - name: Controls
    description: >-
      apm:Control (ontology/apm-ontology.ttl) — a safeguard or measure
      implemented to mitigate risk or satisfy a compliance requirement.
      Same role requirements as Applications.
  - name: Findings
    description: >-
      apm:Finding (ontology/apm-ontology.ttl) — a recorded vulnerability,
      technical risk, business risk, or control gap, tracked through its
      remediation lifecycle. Same role requirements as Applications.
  - name: ApplicationDependencies
    description: >-
      apm:ApplicationDependency (ontology/apm-ontology.ttl) — a directed
      dependency between two applications, capturing the protocol and
      synchronicity of the interaction. Same role requirements as
      Applications.
  - name: CostRecords
    description: >-
      apm:CostRecord (ontology/apm-ontology.ttl) — a recorded cost incurred
      by an application for a specific fiscal year and cost category. Same
      role requirements as Applications.
  - name: PerformanceAssessments
    description: >-
      apm:PerformanceAssessment (ontology/apm-ontology.ttl) — a point-in-time
      evaluation of an application's business and technical fit, enabling
      trend tracking across assessment cycles. Same role requirements as
      Applications.
  - name: Roles
    description: >-
      apm:Role (ontology/apm-ontology.ttl) — the function an actor performs
      in a process, independent of who fulfils it, such as CTO or
      Application Owner. Same role requirements as Applications.
  - name: ApplicationContacts
    description: >-
      apm:ApplicationContact (ontology/apm-ontology.ttl) — an assignment of
      an actor to a specific contact role for an application, such as CTO or
      Information Owner. Same role requirements as Applications.
  - name: Locations
    description: >-
      apm:Location (ontology/apm-ontology.ttl) — a place where business
      activities are performed or architecture elements operate. Same role
      requirements as Applications.
  - name: Documents
    description: >-
      apm:Document (ontology/apm-ontology.ttl) — a reference document or
      link associated with an application, such as an architecture or
      threat model document. Same role requirements as Applications.
  - name: CodeRepositories
    description: >-
      apm:CodeRepository (ontology/apm-ontology.ttl) — a source code
      repository containing the implementation of an application. Same
      role requirements as Applications.
  - name: BusinessFunctions
    description: >-
      apm:BusinessFunction (ontology/apm-ontology.ttl) — a unit of business
      behaviour that delivers capability, independent of organisational
      structure. Same role requirements as Applications.
  - name: BusinessProcesses
    description: >-
      apm:BusinessProcess (ontology/apm-ontology.ttl) — a sequence of
      activities that realises one or more business functions. Same role
      requirements as Applications.
  - name: BusinessServices
    description: >-
      apm:BusinessService (ontology/apm-ontology.ttl) — a unit of business
      functionality, exposed through a defined interface, that supports a
      capability. Same role requirements as Applications.
  - name: TechnologyServices
    description: >-
      apm:TechnologyService (ontology/apm-ontology.ttl) — a technical
      capability supporting application and infrastructure services. Same
      role requirements as Applications.
  - name: LogicalTechnologyComponents
    description: >-
      apm:LogicalTechnologyComponent (ontology/apm-ontology.ttl) — an
      encapsulation of technology infrastructure, independent of vendor or
      product. Same role requirements as Applications.
  - name: PhysicalTechnologyComponents
    description: >-
      apm:PhysicalTechnologyComponent (ontology/apm-ontology.ttl) — a
      deployable technology product, such as a server or network device,
      that realises a logical technology component. Same role requirements
      as Applications.
  - name: TechnologyDependencies
    description: >-
      apm:TechnologyDependency (ontology/apm-ontology.ttl) — a directed
      dependency between two physical technology components, capturing the
      protocol and synchronicity of the interaction. Same role requirements
      as Applications.
  - name: LogicalApplicationComponents
    description: >-
      apm:LogicalApplicationComponent (ontology/apm-ontology.ttl) — an
      encapsulation of application functionality, independent of vendor or
      technology. Same role requirements as Applications.
  - name: PhysicalApplicationComponents
    description: >-
      apm:PhysicalApplicationComponent (ontology/apm-ontology.ttl) — a
      deployable instance that realises one or more logical application
      components. Same role requirements as Applications.
  - name: DataEntities
    description: >-
      apm:DataEntity (ontology/apm-ontology.ttl) — a business-recognised
      concept of data, independent of its implementation. Same role
      requirements as Applications.
  - name: LogicalDataComponents
    description: >-
      apm:LogicalDataComponent (ontology/apm-ontology.ttl) — a structured
      grouping of data entities, independent of implementation. Same role
      requirements as Applications.
  - name: PhysicalDataComponents
    description: >-
      apm:PhysicalDataComponent (ontology/apm-ontology.ttl) — an
      implementation-specific realisation of a logical data component,
      such as a database or file. Same role requirements as Applications.
  - name: SLAMetrics
    description: >-
      apm:SLAMetric (ontology/apm-ontology.ttl) — a single measurable
      commitment within an SLA, defined by an open category and a target
      value with its unit of measure. Same role requirements as
      Applications.
  - name: ServiceLevelAgreements
    description: >-
      apm:ServiceLevelAgreement (ontology/apm-ontology.ttl) — a recorded
      service level agreement for an application, covering a specific
      effective period and one or more owner-defined metrics. Same role
      requirements as Applications.
  - name: Portfolios
    description: >-
      apm:Portfolio (ontology/apm-ontology.ttl) — a curated grouping of
      applications, managed together for strategic, budgetary, or
      governance purposes, with a single accountable owner and business
      capability alignment. Same role requirements as Applications.
  - name: Metrics
    description: >-
      apm:Metric (ontology/apm-ontology.ttl, ISO/IEC 19770-3) — the unit
      used to measure a software entitlement, such as per-user or
      per-device. Same role requirements as Applications.
  - name: SoftwareProducts
    description: >-
      apm:SoftwareProduct (ontology/apm-ontology.ttl, ISO/IEC 19770-2) — a
      software asset identified via a SWID tag. Same role requirements as
      Applications.

paths:
  /auth/login:
    post:
      operationId: login
      tags: [Auth]
      summary: Exchange a username and password for tokens
      description: >-
        Proxies IdP's Direct Access Grant (Resource Owner Password
        Credentials) flow. it is not a production-grade login flow for 
        user-facing clients (which should use Authorization Code + PKCE 
        against IdP directly).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: The issued token pair.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenResponse" }
        "400":
          description: The request body failed validation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Invalid username or password.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /auth/refresh:
    post:
      operationId: refreshToken
      tags: [Auth]
      summary: Exchange a refresh token for a new token pair
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshRequest" }
      responses:
        "200":
          description: The newly issued token pair.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenResponse" }
        "400":
          description: The request body failed validation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: The refresh token is invalid or expired.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /auth/logout:
    post:
      operationId: logout
      tags: [Auth]
      summary: Revoke a refresh token and its session
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshRequest" }
      responses:
        "204":
          description: The session was revoked.
        "400":
          description: The request body failed validation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: The refresh token is invalid or expired.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [Auth]
      summary: Get the authenticated caller's identity
      description: >-
        Returns the identity and IdP realm roles carried by the caller's
        bearer token. Authentication is enforced by the `authenticate`
        Express middleware (JWT signature + issuer verification against
        the IdP's JWKS endpoint), not by this spec's `security` declaration
        below, which exists for documentation / Swagger UI's Authorize button.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The caller's identity.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthenticatedUser" }
        "401":
          description: Missing, malformed, or invalid bearer token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /applications:
    get:
      operationId: listApplications
      tags: [Applications]
      summary: List applications
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: lifecycleStatus
          schema: { $ref: "#/components/schemas/LifecycleStatus" }
        - in: query
          name: criticalityTier
          schema: { $ref: "#/components/schemas/CriticalityTier" }
        - in: query
          name: investmentStrategy
          schema: { $ref: "#/components/schemas/InvestmentStrategy" }
        - in: query
          name: hostingModel
          schema: { $ref: "#/components/schemas/HostingModel" }
        - in: query
          name: complianceStandards
          schema:
            oneOf:
              - $ref: "#/components/schemas/ComplianceStandard"
              - type: array
                items: { $ref: "#/components/schemas/ComplianceStandard" }
        - in: query
          name: search
          description: Case-insensitive substring match against name and description.
          schema: { type: string }
      responses:
        "200":
          description: A list of applications.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Application" }
        "401":
          description: Missing, malformed, or invalid bearer token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: The caller's role does not permit reading applications.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    post:
      operationId: createApplication
      tags: [Applications]
      summary: Create an application
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApplicationCreate" }
      responses:
        "201":
          description: The created application.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Application" }
        "400":
          description: The request body failed validation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Missing, malformed, or invalid bearer token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: The caller's role does not permit creating applications.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: An application with this name already exists.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /applications/stats:
    get:
      operationId: getApplicationStats
      tags: [Applications]
      summary: Get portfolio statistics
      description: Returns aggregate application counts grouped by lifecycle status, criticality tier, and investment strategy, plus the total count.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Portfolio statistics.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApplicationStats" }
        "401":
          description: Missing, malformed, or invalid bearer token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: The caller's role does not permit reading applications.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /applications/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
        description: MongoDB ObjectId of the application.
    get:
      operationId: getApplication
      tags: [Applications]
      summary: Get an application by id
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: The application.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Application" }
        "400":
          description: The id is not a valid ObjectId.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Missing, malformed, or invalid bearer token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: The caller's role does not permit reading applications.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: No application exists with the given id.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    put:
      operationId: updateApplication
      tags: [Applications]
      summary: Update an application
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApplicationUpdate" }
      responses:
        "200":
          description: The updated application.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Application" }
        "400":
          description: The request body failed validation, or the id is not a valid ObjectId.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Missing, malformed, or invalid bearer token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: The caller's role does not permit updating applications.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: No application exists with the given id.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: Another application with this name already exists.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    delete:
      operationId: deleteApplication
      tags: [Applications]
      summary: Delete an application
      security: [{ bearerAuth: [] }]
      responses:
        "204":
          description: The application was deleted.
        "400":
          description: The id is not a valid ObjectId.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Missing, malformed, or invalid bearer token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: The caller's role does not permit deleting applications (admin only).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: No application exists with the given id.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /actors:
    get:
      operationId: listActors
      tags: [Actors]
      summary: List actors
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: role
          schema: { $ref: "#/components/schemas/ObjectId" }
        - in: query
          name: organizationUnit
          schema: { $ref: "#/components/schemas/ObjectId" }
        - in: query
          name: search
          description: Case-insensitive substring match against name and email address.
          schema: { type: string }
      responses:
        "200":
          description: A list of actors.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Actor" }
        "401":
          description: Missing, malformed, or invalid bearer token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: The caller's role does not permit reading actors.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    post:
      operationId: createActor
      tags: [Actors]
      summary: Create an actor
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ActorCreate" }
      responses:
        "201":
          description: The created actor.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Actor" }
        "400":
          description: The request body failed validation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Missing, malformed, or invalid bearer token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: The caller's role does not permit creating actors.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: An actor with this email address already exists.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /actors/{id}:
    parameters:
      - in: path
