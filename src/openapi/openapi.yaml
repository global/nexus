      type: object
      required: [id, roles]
      properties:
        id:
          {
            type: string,
            description: "IdP subject id (the token's `sub` claim).",
          }
        username: { type: string }
        email: { type: string }
        roles:
          type: array
          items: { type: string }
          description: IdP realm roles carried by the token.

