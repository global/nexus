        dataEntities: { type: array, items: { $ref: "#/components/schemas/ObjectId" } }
        technologyServices: { type: array, items: { $ref: "#/components/schemas/ObjectId" } }
        documents: { type: array, items: { $ref: "#/components/schemas/ObjectId" } }
        repositories: { type: array, items: { $ref: "#/components/schemas/ObjectId" } }
        controls: { type: array, items: { $ref: "#/components/schemas/ObjectId" } }
        logicalComponents: { type: array, items: { $ref: "#/components/schemas/ObjectId" } }
        deployments: { type: array, items: { $ref: "#/components/schemas/ObjectId" } }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        __v: { type: integer }

    ApplicationStats:
      type: object
      properties:
        byLifecycleStatus:
          type: array
          items: { type: object }
        byCriticalityTier:
          type: array
          items: { type: object }
        byInvestmentStrategy:
          type: array
          items: { type: object }
        total: { type: integer }

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string }

    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }

    TokenResponse:
      type: object
      required: [accessToken]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        expiresIn:
          {
            type: integer,
            description: Seconds until the access token expires.,
          }
        tokenType: { type: string, example: Bearer }

    AuthenticatedUser:
      type: object
      required: [id, roles]
      properties:
        id:
          {
            type: string,
            description: "IdP subject id (the token's `sub` claim).",
          }
        username: { type: string }
        email: { type: string }
        roles:
          type: array
          items: { type: string }
          description: IdP realm roles carried by the token.

    ErrorResponse:
      type: object
      properties:
        error: { type: string }
        details:
          type: array
          items: { type: object }
