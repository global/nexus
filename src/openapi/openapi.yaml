          name: organizationUnit
          schema: { $ref: "#/components/schemas/ObjectId" }
        - in: query
          name: search
          description: Case-insensitive substring match against name and email address.
          schema: { type: string }
      responses:
        "200":
          description: A list of actors.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Actor" }
        "401":
          description: Missing, malformed, or invalid bearer token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: The caller's role does not permit reading actors.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    post:
      operationId: createActor
      tags: [Actors]
      summary: Create an actor
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ActorCreate" }
      responses:
        "201":
          description: The created actor.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Actor" }
        "400":
          description: The request body failed validation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Missing, malformed, or invalid bearer token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: The caller's role does not permit creating actors.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: An actor with this email address already exists.
          content:
            application/json:
