          content:
            application/json:
              schema: { $ref: "#/components/schemas/BusinessCapability" }
        "400":
          description: The request body failed validation, or the id is not a valid ObjectId.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Missing, malformed, or invalid bearer token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: The caller's role does not permit updating business capabilities.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: No business capability exists with the given id.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: Another business capability with this name already exists.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    delete:
      operationId: deleteBusinessCapability
      tags: [BusinessCapabilities]
      summary: Delete a business capability
      security: [{ bearerAuth: [] }]
      responses:
        "204":
          description: The business capability was deleted.
        "400":
          description: The id is not a valid ObjectId.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Missing, malformed, or invalid bearer token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: The caller's role does not permit deleting business capabilities (admin only).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: No business capability exists with the given id.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: A JWT issued by the IdP realm configured in IdP_URL/IdP_REALM.
  schemas:
    ObjectId:
      type: string
      pattern: "^[0-9a-fA-F]{24}$"
      description: MongoDB ObjectId.

    BusinessCapabilityCreate:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string }
        capabilityWeight: { type: integer, minimum: 1, maximum: 5, description: "Relative strategic importance, 1 (lowest) to 5 (highest)." }
        capabilityLevel: { type: integer, minimum: 1, maximum: 3, description: "Hierarchy depth, e.g. L1=1, L2=2, L3=3." }
        parentCapability: { $ref: "#/components/schemas/ObjectId" }

    BusinessCapabilityUpdate:
      type: object
      description: Same shape as BusinessCapabilityCreate, but every field is optional.
      properties:
        name: { type: string }
        description: { type: string }
        capabilityWeight: { type: integer, minimum: 1, maximum: 5 }
        capabilityLevel: { type: integer, minimum: 1, maximum: 3 }
        parentCapability: { $ref: "#/components/schemas/ObjectId" }

    BusinessCapability:
      description: >-
        The stored representation of a business capability. Only the fields
        the API guarantees are marked required; additional Mongoose-managed
        properties are permitted.
      type: object
      required: [_id, name]
      properties:
        _id: { type: string }
        name: { type: string }
        description: { type: string }
        capabilityWeight: { type: integer }
        capabilityLevel: { type: integer }
        parentCapability: { $ref: "#/components/schemas/ObjectId" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        __v: { type: integer }

    OrganizationUnitCreate:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string }
        costCenterCode: { type: string }
        location: { $ref: "#/components/schemas/ObjectId" }

    OrganizationUnitUpdate:
      type: object
      description: Same shape as OrganizationUnitCreate, but every field is optional.
      properties:
        name: { type: string }
        description: { type: string }
        costCenterCode: { type: string }
        location: { $ref: "#/components/schemas/ObjectId" }

    OrganizationUnit:
      description: >-
        The stored representation of an organization unit. Only the fields
        the API guarantees are marked required; additional Mongoose-managed
        properties are permitted.
      type: object
      required: [_id, name]
      properties:
        _id: { type: string }
        name: { type: string }
        description: { type: string }
        costCenterCode: { type: string }
        location: { $ref: "#/components/schemas/ObjectId" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        __v: { type: integer }

    ActorCreate:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string }
        emailAddress: { type: string, format: email }
        phoneNumber: { type: string }
        role: { $ref: "#/components/schemas/ObjectId" }
        organizationUnit: { $ref: "#/components/schemas/ObjectId" }
        businessProcesses: { type: array, items: { $ref: "#/components/schemas/ObjectId" } }

    ActorUpdate:
      type: object
      description: Same shape as ActorCreate, but every field is optional.
      properties:
        name: { type: string }
        description: { type: string }
        emailAddress: { type: string, format: email }
        phoneNumber: { type: string }
        role: { $ref: "#/components/schemas/ObjectId" }
        organizationUnit: { $ref: "#/components/schemas/ObjectId" }
        businessProcesses: { type: array, items: { $ref: "#/components/schemas/ObjectId" } }

    Actor:
      description: >-
        The stored representation of an actor. Only the fields the API
        guarantees are marked required; additional Mongoose-managed
        properties are permitted.
      type: object
      required: [_id, name]
      properties:
        _id: { type: string }
        name: { type: string }
        description: { type: string }
        emailAddress: { type: string, format: email }
        phoneNumber: { type: string }
        role: { $ref: "#/components/schemas/ObjectId" }
        organizationUnit: { $ref: "#/components/schemas/ObjectId" }
        businessProcesses: { type: array, items: { $ref: "#/components/schemas/ObjectId" } }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        __v: { type: integer }

    LifecycleStatus:
      type: string
      enum: [Planned, Development, Operate, Retired]
    CriticalityTier:
      type: string
      enum: [Critical, High, Medium, Low]
    InvestmentStrategy:
      type: string
      enum: [Tolerate, Invest, Migrate, Eliminate]
    HostingModel:
      type: string
      enum: [ExternallyHosted, InternallyHosted, Hybrid]
    ComplianceStandard:
      type: string
      enum: [SOC2, HIPAA, GDPR, PCIDSS, ISO27001]

    ApplicationCreate:
      type: object
      required: [name, owners]
      properties:
        name: { type: string }
        description: { type: string }
        owners:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/ObjectId" }
          description: Actor ObjectIds; at least one owner is required.
        lifecycleStatus: { $ref: "#/components/schemas/LifecycleStatus" }
        criticalityTier: { $ref: "#/components/schemas/CriticalityTier" }
        investmentStrategy: { $ref: "#/components/schemas/InvestmentStrategy" }
        hostingModel: { $ref: "#/components/schemas/HostingModel" }
        complianceStandards:
          type: array
          items: { $ref: "#/components/schemas/ComplianceStandard" }
        goLiveDate: { type: string, format: date }
        recoveryTimeObjective: { type: string, description: "ISO 8601 duration, e.g. PT4H", example: PT4H }
        recoveryPointObjective: { type: string, description: "ISO 8601 duration, e.g. PT1H", example: PT1H }
        organizationUnit: { $ref: "#/components/schemas/ObjectId" }
        supplier: { $ref: "#/components/schemas/ObjectId" }
        capabilities: { type: array, items: { $ref: "#/components/schemas/ObjectId" } }
        dataEntities: { type: array, items: { $ref: "#/components/schemas/ObjectId" } }
        technologyServices: { type: array, items: { $ref: "#/components/schemas/ObjectId" } }
        documents: { type: array, items: { $ref: "#/components/schemas/ObjectId" } }
        repositories: { type: array, items: { $ref: "#/components/schemas/ObjectId" } }
        controls: { type: array, items: { $ref: "#/components/schemas/ObjectId" } }
        logicalComponents: { type: array, items: { $ref: "#/components/schemas/ObjectId" } }
        deployments: { type: array, items: { $ref: "#/components/schemas/ObjectId" } }

    ApplicationUpdate:
      type: object
      description: Same shape as ApplicationCreate, but every field is optional.
      properties:
        name: { type: string }
        description: { type: string }
        owners:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/ObjectId" }
        lifecycleStatus: { $ref: "#/components/schemas/LifecycleStatus" }
        criticalityTier: { $ref: "#/components/schemas/CriticalityTier" }
        investmentStrategy: { $ref: "#/components/schemas/InvestmentStrategy" }
        hostingModel: { $ref: "#/components/schemas/HostingModel" }
        complianceStandards:
          type: array
          items: { $ref: "#/components/schemas/ComplianceStandard" }
        goLiveDate: { type: string, format: date }
        recoveryTimeObjective: { type: string, example: PT4H }
        recoveryPointObjective: { type: string, example: PT1H }
        organizationUnit: { $ref: "#/components/schemas/ObjectId" }
        supplier: { $ref: "#/components/schemas/ObjectId" }
        capabilities: { type: array, items: { $ref: "#/components/schemas/ObjectId" } }
        dataEntities: { type: array, items: { $ref: "#/components/schemas/ObjectId" } }
        technologyServices: { type: array, items: { $ref: "#/components/schemas/ObjectId" } }
        documents: { type: array, items: { $ref: "#/components/schemas/ObjectId" } }
        repositories: { type: array, items: { $ref: "#/components/schemas/ObjectId" } }
        controls: { type: array, items: { $ref: "#/components/schemas/ObjectId" } }
        logicalComponents: { type: array, items: { $ref: "#/components/schemas/ObjectId" } }
        deployments: { type: array, items: { $ref: "#/components/schemas/ObjectId" } }

    Application:
      description: >-
        The stored representation of an application. Only the fields the API
        guarantees are marked required; additional Mongoose-managed
        properties are permitted.
      type: object
      required: [_id, name]
      properties:
        _id: { type: string }
        name: { type: string }
        description: { type: string }
        owners: { type: array, items: { $ref: "#/components/schemas/ObjectId" } }
        lifecycleStatus: { $ref: "#/components/schemas/LifecycleStatus" }
        criticalityTier: { $ref: "#/components/schemas/CriticalityTier" }
        investmentStrategy: { $ref: "#/components/schemas/InvestmentStrategy" }
        hostingModel: { $ref: "#/components/schemas/HostingModel" }
        complianceStandards:
          type: array
          items: { $ref: "#/components/schemas/ComplianceStandard" }
        goLiveDate: { type: string, format: date }
        recoveryTimeObjective: { type: string }
        recoveryPointObjective: { type: string }
        organizationUnit: { $ref: "#/components/schemas/ObjectId" }
        supplier: { $ref: "#/components/schemas/ObjectId" }
        capabilities: { type: array, items: { $ref: "#/components/schemas/ObjectId" } }
        dataEntities: { type: array, items: { $ref: "#/components/schemas/ObjectId" } }
        technologyServices: { type: array, items: { $ref: "#/components/schemas/ObjectId" } }
        documents: { type: array, items: { $ref: "#/components/schemas/ObjectId" } }
        repositories: { type: array, items: { $ref: "#/components/schemas/ObjectId" } }
        controls: { type: array, items: { $ref: "#/components/schemas/ObjectId" } }
        logicalComponents: { type: array, items: { $ref: "#/components/schemas/ObjectId" } }
        deployments: { type: array, items: { $ref: "#/components/schemas/ObjectId" } }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        __v: { type: integer }

    ApplicationStats:
      type: object
      properties:
        byLifecycleStatus:
          type: array
          items: { type: object }
        byCriticalityTier:
          type: array
          items: { type: object }
        byInvestmentStrategy:
          type: array
          items: { type: object }
        total: { type: integer }

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string }

    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }

    TokenResponse:
      type: object
      required: [accessToken]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        expiresIn:
          {
            type: integer,
            description: Seconds until the access token expires.,
          }
        tokenType: { type: string, example: Bearer }

    AuthenticatedUser:
      type: object
      required: [id, roles]
      properties:
        id:
          {
            type: string,
            description: "IdP subject id (the token's `sub` claim).",
          }
        username: { type: string }
        email: { type: string }
        roles:
          type: array
          items: { type: string }
          description: IdP realm roles carried by the token.

    ErrorResponse:
      type: object
      properties:
        error: { type: string }
        details:
          type: array
          items: { type: object }
