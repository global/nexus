openapi: 3.0.3
info:
  title: Nexus Insight API
  description: >-
    Application Portfolio Management (APM) backend for Nexus Insight,
    modeled after the Nexus Insight APM Ontology (see ontology/apm-ontology.ttl).
  version: 1.0.0
  license:
    name: MIT
servers:
  - url: /api
    description: >-
      Base path for every documented endpoint. Any request under /api that
      does not match a path/method declared below is rejected by the runtime
      OpenAPI validator; endpoints outside /api are not affected.
tags:
  - name: Auth
    description: Identity of the caller, as issued by the IdP identity provider.
  - name: Applications
    description: >-
      apm:Application (ontology/apm-ontology.ttl) — the ontology-aligned
      application portfolio. Every endpoint requires a bearer token; reads
      require the admin, portfolio-manager, or viewer realm role, writes
      require admin or portfolio-manager, and delete requires admin.
  - name: Actors
    description: >-
      apm:Actor (ontology/apm-ontology.ttl) — a person, organisation, or
      system that participates in business activities, such as an
      application owner. Same role requirements as Applications.
  - name: OrganizationUnits
    description: >-
      apm:OrganizationUnit (ontology/apm-ontology.ttl) — a self-contained
      unit of the enterprise with defined management responsibility. Same
      role requirements as Applications.
  - name: BusinessCapabilities
    description: >-
      apm:BusinessCapability (ontology/apm-ontology.ttl) — an ability the
      business has to deliver value, organised into an L1/L2/L3 hierarchy
      via parentCapability. Same role requirements as Applications.

paths:
  /auth/login:
    post:
      operationId: login
      tags: [Auth]
      summary: Exchange a username and password for tokens
      description: >-
        Proxies IdP's Direct Access Grant (Resource Owner Password
        Credentials) flow. it is not a production-grade login flow for 
        user-facing clients (which should use Authorization Code + PKCE 
        against IdP directly).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: The issued token pair.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenResponse" }
        "400":
          description: The request body failed validation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Invalid username or password.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /auth/refresh:
    post:
      operationId: refreshToken
      tags: [Auth]
      summary: Exchange a refresh token for a new token pair
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshRequest" }
      responses:
        "200":
          description: The newly issued token pair.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenResponse" }
        "400":
          description: The request body failed validation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: The refresh token is invalid or expired.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /auth/logout:
    post:
      operationId: logout
      tags: [Auth]
      summary: Revoke a refresh token and its session
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshRequest" }
      responses:
        "204":
          description: The session was revoked.
        "400":
          description: The request body failed validation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: The refresh token is invalid or expired.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [Auth]
      summary: Get the authenticated caller's identity
      description: >-
        Returns the identity and IdP realm roles carried by the caller's
        bearer token. Authentication is enforced by the `authenticate`
        Express middleware (JWT signature + issuer verification against
        the IdP's JWKS endpoint), not by this spec's `security` declaration
        below, which exists for documentation / Swagger UI's Authorize button.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The caller's identity.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthenticatedUser" }
        "401":
          description: Missing, malformed, or invalid bearer token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /applications:
    get:
      operationId: listApplications
      tags: [Applications]
      summary: List applications
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: lifecycleStatus
          schema: { $ref: "#/components/schemas/LifecycleStatus" }
        - in: query
          name: criticalityTier
          schema: { $ref: "#/components/schemas/CriticalityTier" }
        - in: query
          name: investmentStrategy
          schema: { $ref: "#/components/schemas/InvestmentStrategy" }
        - in: query
          name: hostingModel
          schema: { $ref: "#/components/schemas/HostingModel" }
        - in: query
          name: complianceStandards
          schema:
            oneOf:
              - $ref: "#/components/schemas/ComplianceStandard"
              - type: array
                items: { $ref: "#/components/schemas/ComplianceStandard" }
        - in: query
          name: search
          description: Case-insensitive substring match against name and description.
          schema: { type: string }
      responses:
        "200":
          description: A list of applications.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Application" }
        "401":
          description: Missing, malformed, or invalid bearer token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: The caller's role does not permit reading applications.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    post:
      operationId: createApplication
      tags: [Applications]
      summary: Create an application
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApplicationCreate" }
      responses:
        "201":
          description: The created application.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Application" }
        "400":
          description: The request body failed validation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Missing, malformed, or invalid bearer token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: The caller's role does not permit creating applications.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: An application with this name already exists.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /applications/stats:
    get:
      operationId: getApplicationStats
      tags: [Applications]
      summary: Get portfolio statistics
      description: Returns aggregate application counts grouped by lifecycle status, criticality tier, and investment strategy, plus the total count.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Portfolio statistics.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApplicationStats" }
        "401":
          description: Missing, malformed, or invalid bearer token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: The caller's role does not permit reading applications.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /applications/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
        description: MongoDB ObjectId of the application.
    get:
      operationId: getApplication
      tags: [Applications]
      summary: Get an application by id
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: The application.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Application" }
        "400":
          description: The id is not a valid ObjectId.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Missing, malformed, or invalid bearer token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: The caller's role does not permit reading applications.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: No application exists with the given id.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    put:
      operationId: updateApplication
      tags: [Applications]
      summary: Update an application
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApplicationUpdate" }
      responses:
        "200":
          description: The updated application.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Application" }
        "400":
          description: The request body failed validation, or the id is not a valid ObjectId.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Missing, malformed, or invalid bearer token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: The caller's role does not permit updating applications.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: No application exists with the given id.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: Another application with this name already exists.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    delete:
      operationId: deleteApplication
      tags: [Applications]
      summary: Delete an application
      security: [{ bearerAuth: [] }]
      responses:
        "204":
          description: The application was deleted.
        "400":
          description: The id is not a valid ObjectId.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Missing, malformed, or invalid bearer token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: The caller's role does not permit deleting applications (admin only).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: No application exists with the given id.
          content:
