  /organization-units:
    get:
      operationId: listOrganizationUnits
      tags: [OrganizationUnits]
      summary: List organization units
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: location
          schema: { $ref: "#/components/schemas/ObjectId" }
        - in: query
          name: search
          description: Case-insensitive substring match against name, description, and cost center code.
          schema: { type: string }
      responses:
