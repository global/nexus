components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: A JWT issued by the IdP realm configured in IdP_URL/IdP_REALM.
  schemas:
    ObjectId:
      type: string
      pattern: "^[0-9a-fA-F]{24}$"
      description: MongoDB ObjectId.

    FindingCategory:
      type: string
      enum: [Vulnerability, TechnicalRisk, BusinessRisk, ControlGap]
    FindingStatus:
      type: string
      enum: [Open, InRemediation, Remediated, RiskAccepted, Closed]
    ImpactType:
      type: string
      enum: [DataBreach, ServiceOutage, RegulatoryFine, ReputationalDamage, FinancialLoss, SafetyRisk, ContractualBreach]

    FindingCreate:
      type: object
      required: [findingDetails, findingCategory]
      properties:
        findingDetails: { type: string }
        findingCategory: { $ref: "#/components/schemas/FindingCategory" }
        findingStatus: { $ref: "#/components/schemas/FindingStatus", description: "Defaults to Open if omitted." }
        application: { $ref: "#/components/schemas/ObjectId" }
        applicationComponent: { $ref: "#/components/schemas/ObjectId" }
        technologyComponent: { $ref: "#/components/schemas/ObjectId" }
        threatenedCapability: { $ref: "#/components/schemas/ObjectId" }
        relatedControl: { $ref: "#/components/schemas/ObjectId" }
        impactTypes: { type: array, items: { $ref: "#/components/schemas/ImpactType" } }
        cveId: { type: string }
        cvssScore: { type: number, minimum: 0, maximum: 10, description: "Only accepted when findingCategory is Vulnerability." }
        identifiedOn: { type: string, description: "ISO 8601 date or date-time." }
        dueDate: { type: string, description: "ISO 8601 date or date-time." }
        resolvedDate: { type: string, description: "ISO 8601 date or date-time." }
        riskScore: { type: integer, minimum: 1, maximum: 5 }
        likelihoodScore: { type: integer, minimum: 1, maximum: 5 }
        impactScore: { type: integer, minimum: 1, maximum: 5 }

    FindingUpdate:
      type: object
      description: Same shape as FindingCreate, but every field is optional.
      properties:
        findingDetails: { type: string }
        findingCategory: { $ref: "#/components/schemas/FindingCategory" }
        findingStatus: { $ref: "#/components/schemas/FindingStatus" }
        application: { $ref: "#/components/schemas/ObjectId" }
        applicationComponent: { $ref: "#/components/schemas/ObjectId" }
        technologyComponent: { $ref: "#/components/schemas/ObjectId" }
        threatenedCapability: { $ref: "#/components/schemas/ObjectId" }
        relatedControl: { $ref: "#/components/schemas/ObjectId" }
        impactTypes: { type: array, items: { $ref: "#/components/schemas/ImpactType" } }
        cveId: { type: string }
        cvssScore: { type: number, minimum: 0, maximum: 10 }
        identifiedOn: { type: string }
        dueDate: { type: string }
        resolvedDate: { type: string }
        riskScore: { type: integer, minimum: 1, maximum: 5 }
        likelihoodScore: { type: integer, minimum: 1, maximum: 5 }
        impactScore: { type: integer, minimum: 1, maximum: 5 }

    Finding:
      description: >-
        The stored representation of a finding. Only the fields the API
        guarantees are marked required; additional Mongoose-managed
        properties are permitted.
      type: object
      required: [_id, findingDetails, findingCategory, findingStatus]
      properties:
        _id: { type: string }
        findingDetails: { type: string }
        findingCategory: { $ref: "#/components/schemas/FindingCategory" }
        findingStatus: { $ref: "#/components/schemas/FindingStatus" }
        application: { $ref: "#/components/schemas/ObjectId" }
        applicationComponent: { $ref: "#/components/schemas/ObjectId" }
        technologyComponent: { $ref: "#/components/schemas/ObjectId" }
        threatenedCapability: { $ref: "#/components/schemas/ObjectId" }
        relatedControl: { $ref: "#/components/schemas/ObjectId" }
        impactTypes: { type: array, items: { $ref: "#/components/schemas/ImpactType" } }
        cveId: { type: string }
        cvssScore: { type: number }
        identifiedOn: { type: string, format: date-time }
        dueDate: { type: string, format: date-time }
        resolvedDate: { type: string, format: date-time }
        riskScore: { type: integer }
        likelihoodScore: { type: integer }
        impactScore: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        __v: { type: integer }

    ApplicationDependencyCreate:
      type: object
      required: [upstreamApplication, downstreamApplication, usesProtocol, hasSynchronicity]
      properties:
        upstreamApplication: { $ref: "#/components/schemas/ObjectId", description: "The application that provides the capability being relied upon." }
        downstreamApplication: { $ref: "#/components/schemas/ObjectId", description: "The application that consumes the upstream application's capability. Must differ from upstreamApplication." }
        usesProtocol: { $ref: "#/components/schemas/DependencyProtocol" }
        hasSynchronicity: { $ref: "#/components/schemas/Synchronicity" }

    ApplicationDependencyUpdate:
      type: object
      description: Same shape as ApplicationDependencyCreate, but every field is optional.
      properties:
        upstreamApplication: { $ref: "#/components/schemas/ObjectId" }
        downstreamApplication: { $ref: "#/components/schemas/ObjectId" }
        usesProtocol: { $ref: "#/components/schemas/DependencyProtocol" }
        hasSynchronicity: { $ref: "#/components/schemas/Synchronicity" }

    ApplicationDependency:
      description: >-
        The stored representation of an application dependency. Only the
        fields the API guarantees are marked required; additional
        Mongoose-managed properties are permitted.
      type: object
      required: [_id, upstreamApplication, downstreamApplication, usesProtocol, hasSynchronicity]
      properties:
        _id: { type: string }
        upstreamApplication: { $ref: "#/components/schemas/ObjectId" }
        downstreamApplication: { $ref: "#/components/schemas/ObjectId" }
        usesProtocol: { $ref: "#/components/schemas/DependencyProtocol" }
        hasSynchronicity: { $ref: "#/components/schemas/Synchronicity" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        __v: { type: integer }

    CostRecordCreate:
      type: object
      required: [incurredByApplication, hasCostCategory, costAmount, costCurrency, fiscalYear]
      properties:
        incurredByApplication: { $ref: "#/components/schemas/ObjectId" }
        hasCostCategory: { $ref: "#/components/schemas/CostCategory" }
        costAmount: { type: number }
        costCurrency: { type: string, description: "ISO 4217 currency code, e.g. USD or EUR.", example: EUR }
        fiscalYear: { type: string, description: "4-digit year.", example: "2026" }

    CostRecordUpdate:
      type: object
      description: Same shape as CostRecordCreate, but every field is optional.
      properties:
        incurredByApplication: { $ref: "#/components/schemas/ObjectId" }
        hasCostCategory: { $ref: "#/components/schemas/CostCategory" }
        costAmount: { type: number }
        costCurrency: { type: string }
        fiscalYear: { type: string }

    CostRecord:
      description: >-
        The stored representation of a cost record. Only the fields the API
        guarantees are marked required; additional Mongoose-managed
        properties are permitted.
      type: object
      required: [_id, incurredByApplication, hasCostCategory, costAmount, costCurrency, fiscalYear]
      properties:
        _id: { type: string }
        incurredByApplication: { $ref: "#/components/schemas/ObjectId" }
        hasCostCategory: { $ref: "#/components/schemas/CostCategory" }
        costAmount: { type: number }
        costCurrency: { type: string }
        fiscalYear: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        __v: { type: integer }

    PerformanceAssessmentCreate:
      type: object
      required: [assessesApplication, assessedOn]
      properties:
        assessesApplication: { $ref: "#/components/schemas/ObjectId" }
        assessedBy: { $ref: "#/components/schemas/ObjectId", description: "Actor id who conducted the assessment." }
        businessFitScore: { type: integer, minimum: 1, maximum: 5 }
        technicalFitScore: { type: integer, minimum: 1, maximum: 5 }
        assessedOn: { type: string, description: "ISO 8601 date or date-time." }

    PerformanceAssessmentUpdate:
      type: object
      description: Same shape as PerformanceAssessmentCreate, but every field is optional.
      properties:
        assessesApplication: { $ref: "#/components/schemas/ObjectId" }
        assessedBy: { $ref: "#/components/schemas/ObjectId" }
        businessFitScore: { type: integer, minimum: 1, maximum: 5 }
        technicalFitScore: { type: integer, minimum: 1, maximum: 5 }
        assessedOn: { type: string }

    PerformanceAssessment:
      description: >-
        The stored representation of a performance assessment. Only the
        fields the API guarantees are marked required; additional
        Mongoose-managed properties are permitted.
      type: object
      required: [_id, assessesApplication, assessedOn]
      properties:
        _id: { type: string }
        assessesApplication: { $ref: "#/components/schemas/ObjectId" }
        assessedBy: { $ref: "#/components/schemas/ObjectId" }
        businessFitScore: { type: integer }
        technicalFitScore: { type: integer }
        assessedOn: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        __v: { type: integer }

    RoleCreate:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string }

    RoleUpdate:
      type: object
      description: Same shape as RoleCreate, but every field is optional.
      properties:
        name: { type: string }
        description: { type: string }

    Role:
      description: >-
        The stored representation of a role. Only the fields the API
        guarantees are marked required; additional Mongoose-managed
        properties are permitted.
      type: object
      required: [_id, name]
      properties:
        _id: { type: string }
        name: { type: string }
        description: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        __v: { type: integer }

    ApplicationContactCreate:
      type: object
      required: [forApplication, contactActor, contactRole]
      properties:
        forApplication: { $ref: "#/components/schemas/ObjectId" }
