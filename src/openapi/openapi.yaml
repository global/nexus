          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Missing, malformed, or invalid bearer token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: The caller's role does not permit updating organization units.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: No organization unit exists with the given id.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: Another organization unit with this cost center code already exists.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    delete:
      operationId: deleteOrganizationUnit
      tags: [OrganizationUnits]
      summary: Delete an organization unit
      security: [{ bearerAuth: [] }]
      responses:
        "204":
          description: The organization unit was deleted.
        "400":
          description: The id is not a valid ObjectId.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Missing, malformed, or invalid bearer token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: The caller's role does not permit deleting organization units (admin only).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: No organization unit exists with the given id.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /business-capabilities:
    get:
      operationId: listBusinessCapabilities
      tags: [BusinessCapabilities]
      summary: List business capabilities
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: parentCapability
          schema: { $ref: "#/components/schemas/ObjectId" }
        - in: query
          name: capabilityLevel
          schema: { type: integer, minimum: 1, maximum: 3 }
        - in: query
          name: search
          description: Case-insensitive substring match against name and description.
          schema: { type: string }
      responses:
        "200":
          description: A list of business capabilities.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BusinessCapability" }
        "401":
          description: Missing, malformed, or invalid bearer token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: The caller's role does not permit reading business capabilities.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    post:
      operationId: createBusinessCapability
