  /organization-units:
    get:
      operationId: listOrganizationUnits
      tags: [OrganizationUnits]
      summary: List organization units
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: location
          schema: { $ref: "#/components/schemas/ObjectId" }
        - in: query
          name: search
          description: Case-insensitive substring match against name, description, and cost center code.
          schema: { type: string }
      responses:
        "200":
          description: A list of organization units.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/OrganizationUnit" }
        "401":
          description: Missing, malformed, or invalid bearer token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: The caller's role does not permit reading organization units.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    post:
      operationId: createOrganizationUnit
      tags: [OrganizationUnits]
      summary: Create an organization unit
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrganizationUnitCreate" }
      responses:
        "201":
          description: The created organization unit.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationUnit" }
        "400":
          description: The request body failed validation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Missing, malformed, or invalid bearer token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: The caller's role does not permit creating organization units.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: An organization unit with this cost center code already exists.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /organization-units/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
        description: MongoDB ObjectId of the organization unit.
    get:
      operationId: getOrganizationUnit
      tags: [OrganizationUnits]
      summary: Get an organization unit by id
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: The organization unit.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationUnit" }
        "400":
          description: The id is not a valid ObjectId.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Missing, malformed, or invalid bearer token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: The caller's role does not permit reading organization units.
