          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: A software product with this name already exists.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /software-products/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
        description: MongoDB ObjectId of the software product.
    get:
      operationId: getSoftwareProduct
      tags: [SoftwareProducts]
      summary: Get a software product by id
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: The software product.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SoftwareProduct" }
        "400":
          description: The id is not a valid ObjectId.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Missing, malformed, or invalid bearer token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: The caller's role does not permit reading software products.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: No software product exists with the given id.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    put:
      operationId: updateSoftwareProduct
      tags: [SoftwareProducts]
      summary: Update a software product
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SoftwareProductUpdate" }
      responses:
        "200":
          description: The updated software product.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SoftwareProduct" }
        "400":
          description: >-
            The request body failed validation, or the id is not a valid
            ObjectId.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Missing, malformed, or invalid bearer token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: The caller's role does not permit updating software products.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: No software product exists with the given id.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: Another software product with this name already exists.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    delete:
      operationId: deleteSoftwareProduct
      tags: [SoftwareProducts]
      summary: Delete a software product
      security: [{ bearerAuth: [] }]
      responses:
        "204":
          description: The software product was deleted.
        "400":
          description: The id is not a valid ObjectId.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Missing, malformed, or invalid bearer token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: The caller's role does not permit deleting software products (admin only).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: No software product exists with the given id.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: A JWT issued by the IdP realm configured in IdP_URL/IdP_REALM.
  schemas:
    ObjectId:
      type: string
      pattern: "^[0-9a-fA-F]{24}$"
      description: MongoDB ObjectId.

    FindingCategory:
      type: string
      enum: [Vulnerability, TechnicalRisk, BusinessRisk, ControlGap]
    FindingStatus:
      type: string
      enum: [Open, InRemediation, Remediated, RiskAccepted, Closed]
    ImpactType:
      type: string
      enum: [DataBreach, ServiceOutage, RegulatoryFine, ReputationalDamage, FinancialLoss, SafetyRisk, ContractualBreach]
    SLACategory:
      type: string
      enum: [Availability, Throughput, ResponseTime, ResolutionTime]

    FindingCreate:
      type: object
      required: [findingDetails, findingCategory]
      properties:
        findingDetails: { type: string }
        findingCategory: { $ref: "#/components/schemas/FindingCategory" }
        findingStatus: { $ref: "#/components/schemas/FindingStatus", description: "Defaults to Open if omitted." }
        application: { $ref: "#/components/schemas/ObjectId" }
        applicationComponent: { $ref: "#/components/schemas/ObjectId" }
        technologyComponent: { $ref: "#/components/schemas/ObjectId" }
        threatenedCapability: { $ref: "#/components/schemas/ObjectId" }
        relatedControl: { $ref: "#/components/schemas/ObjectId" }
        impactTypes: { type: array, items: { $ref: "#/components/schemas/ImpactType" } }
        cveId: { type: string }
        cvssScore: { type: number, minimum: 0, maximum: 10, description: "Only accepted when findingCategory is Vulnerability." }
        identifiedOn: { type: string, description: "ISO 8601 date or date-time." }
        dueDate: { type: string, description: "ISO 8601 date or date-time." }
        resolvedDate: { type: string, description: "ISO 8601 date or date-time." }
        riskScore: { type: integer, minimum: 1, maximum: 5 }
        likelihoodScore: { type: integer, minimum: 1, maximum: 5 }
        impactScore: { type: integer, minimum: 1, maximum: 5 }

    FindingUpdate:
      type: object
      description: Same shape as FindingCreate, but every field is optional.
      properties:
        findingDetails: { type: string }
        findingCategory: { $ref: "#/components/schemas/FindingCategory" }
        findingStatus: { $ref: "#/components/schemas/FindingStatus" }
        application: { $ref: "#/components/schemas/ObjectId" }
        applicationComponent: { $ref: "#/components/schemas/ObjectId" }
        technologyComponent: { $ref: "#/components/schemas/ObjectId" }
        threatenedCapability: { $ref: "#/components/schemas/ObjectId" }
        relatedControl: { $ref: "#/components/schemas/ObjectId" }
        impactTypes: { type: array, items: { $ref: "#/components/schemas/ImpactType" } }
        cveId: { type: string }
        cvssScore: { type: number, minimum: 0, maximum: 10 }
        identifiedOn: { type: string }
        dueDate: { type: string }
        resolvedDate: { type: string }
        riskScore: { type: integer, minimum: 1, maximum: 5 }
        likelihoodScore: { type: integer, minimum: 1, maximum: 5 }
        impactScore: { type: integer, minimum: 1, maximum: 5 }

    Finding:
      description: >-
        The stored representation of a finding. Only the fields the API
        guarantees are marked required; additional Mongoose-managed
        properties are permitted.
      type: object
      required: [_id, findingDetails, findingCategory, findingStatus]
      properties:
        _id: { type: string }
        findingDetails: { type: string }
        findingCategory: { $ref: "#/components/schemas/FindingCategory" }
        findingStatus: { $ref: "#/components/schemas/FindingStatus" }
        application: { $ref: "#/components/schemas/ObjectId" }
        applicationComponent: { $ref: "#/components/schemas/ObjectId" }
        technologyComponent: { $ref: "#/components/schemas/ObjectId" }
        threatenedCapability: { $ref: "#/components/schemas/ObjectId" }
        relatedControl: { $ref: "#/components/schemas/ObjectId" }
        impactTypes: { type: array, items: { $ref: "#/components/schemas/ImpactType" } }
        cveId: { type: string }
        cvssScore: { type: number }
        identifiedOn: { type: string, format: date-time }
        dueDate: { type: string, format: date-time }
        resolvedDate: { type: string, format: date-time }
        riskScore: { type: integer }
        likelihoodScore: { type: integer }
        impactScore: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        __v: { type: integer }

    ApplicationDependencyCreate:
      type: object
      required: [upstreamApplication, downstreamApplication, usesProtocol, hasSynchronicity]
      properties:
        upstreamApplication: { $ref: "#/components/schemas/ObjectId", description: "The application that provides the capability being relied upon." }
        downstreamApplication: { $ref: "#/components/schemas/ObjectId", description: "The application that consumes the upstream application's capability. Must differ from upstreamApplication." }
        usesProtocol: { $ref: "#/components/schemas/DependencyProtocol" }
        hasSynchronicity: { $ref: "#/components/schemas/Synchronicity" }

    ApplicationDependencyUpdate:
      type: object
